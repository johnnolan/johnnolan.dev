name: "[workflow] Build and Deploy"

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SITE_ARTIFACT: production-site-${{ github.run_id }}

jobs:
  build:
    name: Build production site
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Build and validate production output
        run: yarn run verify:production
      - name: Store generated site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: _site/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish production to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Restore verified site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: _site/
      - name: Publish to Cloudflare Pages
        run: yarn wrangler pages deploy _site --project-name=johnnolan-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
