name: "[workflow] Pull Request"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SITE_ARTIFACT: site-${{ github.run_id }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Validate JavaScript, Markdown, spelling, and SCSS
        run: yarn run lint:all

  build:
    name: Build production site
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Build and validate production output
        run: yarn run verify:production
      - name: Store generated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: _site/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test generated site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Restore generated site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: _site/
      - name: Test article and build integrations
        run: |
          yarn run test:content
          yarn run test:scss
      - name: Audit pages using Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: "./lighthouserc.json"
          budgetPath: ./src/_includes/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  publish-preview:
    name: Publish Cloudflare preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node and Yarn cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Restore tested site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: _site/
      - name: Publish Cloudflare Pages preview
        id: deploy_preview
        run: |
          set -euo pipefail
          output="$(yarn wrangler pages deploy _site --project-name=johnnolan-dev --branch=pr-${{ github.event.pull_request.number }} 2>&1)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "Cloudflare Pages preview URL was not found in Wrangler output" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish preview URL to the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BODY_PREFIX: "<!-- cloudflare-pages-preview -->"
          OWNER: "johnnolan"
          REPO: "johnnolan.dev"
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
        with:
          script: |
            const prNumber = context.payload.number
            const commentBody = `${process.env.BODY_PREFIX}\n<h2>Cloudflare Pages preview</h2>\n\nReview this PR before merging: ${process.env.PREVIEW_URL}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: process.env.OWNER,
              repo: process.env.REPO,
              issue_number: prNumber,
            })
            const previousComment = comments.find((comment) =>
              comment.body.startsWith(process.env.BODY_PREFIX),
            )
            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: process.env.OWNER,
                repo: process.env.REPO,
                comment_id: previousComment.id,
                body: commentBody,
              })
            } else {
              await github.rest.issues.createComment({
                owner: process.env.OWNER,
                repo: process.env.REPO,
                issue_number: prNumber,
                body: commentBody,
              })
            }
